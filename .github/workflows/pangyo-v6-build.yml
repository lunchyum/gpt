name: Pangyo v6 build
on:
  push:
    branches: ["chatgpt/pangyo-v6-build"]
    paths:
      - "pangyo-v6-src.tgz"
      - ".github/workflows/pangyo-v6-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "pangyo-v6-src.tgz"
      - ".github/workflows/pangyo-v6-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore project
        run: tar -xzf pangyo-v6-src.tgz
      - name: Build debug APK
        run: gradle -p pangyo-v6-ghsrc :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pangyo-v6-apk
          path: pangyo-v6-ghsrc/app/build/outputs/apk/debug/app-debug.apk
