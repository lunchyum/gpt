name: Google Trends batch

on:
  pull_request:
    branches: [ main ]

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -U trendspy pandas openpyxl
      - name: Run batch
        run: python trends/run_batch.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: trends-batch-01-results
          path: trends/results/
