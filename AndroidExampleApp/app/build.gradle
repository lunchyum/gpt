plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.lunchyum.neiswallpaper'
    compileSdk 37

    defaultConfig {
        applicationId 'com.lunchyum.neiswallpaper'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    buildFeatures { compose true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.compose.ui:ui:1.12.0-rc01'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.12.0-rc01'
    implementation 'androidx.compose.animation:animation:1.12.0-rc01'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha25'
    implementation 'androidx.compose.material:material-icons-extended:1.12.0-rc01'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.12.0-rc01'
}
